[package]
name = "queens-build-rs"
version = "0.1.0"
edition = "2024"

# A Cargo package can have both a library crate (lib.rs) and a binary crate
# (main.rs). The binary links against the library using the package name
# (hyphens replaced by underscores → queens_build_rs).
[lib]
name = "queens_build_rs"
path = "src/lib.rs"

[[bin]]
name = "queens"
path = "src/main.rs"

[build-dependencies]
# The `cc` crate is a build-time helper that invokes the system C compiler
# and emits the necessary Cargo link directives automatically.
cc = "1"
