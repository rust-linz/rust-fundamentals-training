[workspace]
resolver = "3"
members = [
    "battleship_game_logic",
    "console_game",
    "battleship_web_api",
    "battleship_wasm",
]

# Note: Cargo only reads profiles from the workspace root
[profile.release]
# Tell `rustc` to optimize for small code size (relevant for WebAssembly).
opt-level = "s"
