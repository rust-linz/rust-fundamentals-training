[package]
name = "battleship_wasm"
version = "0.1.0"
authors = ["Rainer <rainer@software-architects.at>"]
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["console_error_panic_hook"]

[dependencies]
wasm-bindgen = "0.2"
battleship_game_logic = { path = "../battleship_game_logic" }
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"

# `rand` uses `getrandom` for its random seed. In the browser, the `wasm_js` feature
# makes it use the Web Crypto API. Libraries like our game logic should not enable
# this feature, so we enable it here in the crate that actually targets the browser.
getrandom = { version = "0.4", features = ["wasm_js"] }

# The `console_error_panic_hook` crate provides better debugging of panics by
# logging them with `console.error`. This is great for development, but requires
# all the `std::fmt` and `std::panicking` infrastructure, so isn't great for
# code size when deploying.
console_error_panic_hook = { version = "0.1", optional = true }

[dev-dependencies]
wasm-bindgen-test = "0.3"
